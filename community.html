<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirkiramun Community Forum</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .forum-container {
      background-color: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      width: 550px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .post-form {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }

    .post-form textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 15px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
      background-color: #fafafa;
      resize: none;
    }

    .file-upload {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 8px;
      background-color: #f9f9f9;
    }

    .file-upload input[type="file"] {
      border: none;
      padding: 5px;
      font-size: 14px;
      color: #333;
      background-color: #f9f9f9;
      cursor: pointer;
    }

    .file-upload label {
      font-size: 14px;
      color: #007bff;
      cursor: pointer;
      margin-right: 10px;
      font-weight: bold;
    }

    .post-form button {
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s ease;
    }

    .post-form button:hover {
      background-color: #0056b3;
    }

    .posts-container {
      margin-top: 20px;
    }

    .post {
      background-color: #fafafa;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }

    .post img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .user-id {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
      font-style: italic;
    }

    .post-time {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .actions {
      margin-top: 15px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }

    .actions button {
      background: none;
      border: none;
      color: #007bff;
      font-size: 14px;
      cursor: pointer;
      margin-right: 15px;
      transition: color 0.3s ease;
    }

    .actions button:hover {
      color: #0056b3;
      text-decoration: underline;
    }

    .like-count {
      color: #333;
      font-weight: bold;
    }

    /* New styles for Like and Comment buttons */
    .like-btn, .comment-btn {
      background-color: #28a745;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s ease;
      border: none;
    }

    .like-btn:hover, .comment-btn:hover {
      background-color: #218838;
    }

  </style>
</head>
<body>
  <div class="forum-container">
    <h1>Community Forum</h1>
    <div class="post-form">
      <textarea id="post-content" placeholder="Write something..."></textarea>
      
      <!-- File Upload Section -->
      <div class="file-upload">
        <label for="image-upload">Upload Image:</label>
        <input type="file" id="image-upload" accept="image/*">
      </div>
      
      <button id="post-btn">Post</button>
    </div>

    <div class="posts-container" id="posts-container"></div>
  </div>

  <script>
    // Function to generate a static user ID "Asararu Zallah"
    function generateUserId() {
      return 'Asararu Zallah';
    }

    // Function to get posts from local storage
    function getPosts() {
      const posts = JSON.parse(localStorage.getItem('posts')) || [];
      return posts;
    }

    // Function to save posts to local storage
    function savePosts(posts) {
      localStorage.setItem('posts', JSON.stringify(posts));
    }

    // Function to format date and time
    function getCurrentDateTime() {
      const now = new Date();
      const date = now.toLocaleDateString();
      const time = now.toLocaleTimeString();
      return `${date} at ${time}`;
    }

    // Function to render posts to the screen
    function renderPosts() {
      const posts = getPosts();
      const postsContainer = document.getElementById('posts-container');
      postsContainer.innerHTML = ''; // Clear existing posts

      posts.forEach(post => {
        const postElement = document.createElement('div');
        postElement.classList.add('post');
        
        const content = document.createElement('p');
        content.textContent = post.content;
        
        const userIdElement = document.createElement('p');
        userIdElement.classList.add('user-id');
        userIdElement.textContent = `Posted by: ${post.userId}`;

        const postTimeElement = document.createElement('p');
        postTimeElement.classList.add('post-time');
        postTimeElement.textContent = `Posted on: ${post.timestamp}`;

        postElement.appendChild(content);
        postElement.appendChild(userIdElement);
        postElement.appendChild(postTimeElement);
        
        // Display image if there is one
        if (post.image) {
          const img = document.createElement('img');
          img.src = post.image;
          postElement.appendChild(img);
        }
        
        // Like and comment buttons
        const actions = document.createElement('div');
        actions.classList.add('actions');
        
        const likeButton = document.createElement('button');
        likeButton.textContent = `Like`;
        likeButton.classList.add('like-btn');
        likeButton.addEventListener('click', () => {
          post.likes += 1;
          savePosts(getPosts());
          renderPosts(); // Re-render posts after liking
        });

        const likeCount = document.createElement('span');
        likeCount.classList.add('like-count');
        likeCount.textContent = `(${post.likes})`;

        const commentButton = document.createElement('button');
        commentButton.textContent = 'Comment';
        commentButton.classList.add('comment-btn');
        commentButton.addEventListener('click', () => {
          const comment = prompt("Enter your comment:");
          if (comment) {
            post.comments.push(comment);
            savePosts(getPosts());
            renderPosts(); // Re-render posts after commenting
          }
        });

        actions.appendChild(likeButton);
        actions.appendChild(likeCount);
        actions.appendChild(commentButton);
        
        postElement.appendChild(actions);

        postsContainer.prepend(postElement); // Add the new post at the top
      });
    }

    // Event listener for the Post button
    document.getElementById('post-btn').addEventListener('click', () => {
      const content = document.getElementById('post-content').value;
      const imageUpload = document.getElementById('image-upload').files[0];

      if (content) {
        const posts = getPosts();

        // Generate static user ID "Asararu Zallah"
        const userId = generateUserId();
        const timestamp = getCurrentDateTime();

        // Prepare new post
        const newPost = {
          content: content,
          userId: userId,
          image: imageUpload ? URL.createObjectURL(imageUpload) : null,
          likes: 0,
          comments: [],
          timestamp: timestamp // Add timestamp to post
        };

        posts.unshift(newPost); // Add new post to the beginning
        savePosts(posts);

        // Clear the form and re-render posts
        document.getElementById('post-content').value = '';
        document.getElementById('image-upload').value = '';
        renderPosts();
      }
    });

    // Initialize forum
    renderPosts();
  </script>
</body>
</html>
