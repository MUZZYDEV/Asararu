        // Burujin Zodiac
        const zodiacSigns = {
            1: "Himlu, Shine buruji na daya, Himlu shine buruji na farko, yana da alaƙa da ƙarfi, kuzari, da fara sabbin abubuwa. Mutanen himlu suna ƙarƙashin tasirin tauraron Murrikh kuma wuta wanda ke basu halin jarumta da jajircewa. Halayensu yan gwagwarmaya, suna son fuskantar kalubale kuma suna ƙoƙarin zama na farko a duk abin da suke yi, Sunada zuciya duk abin da suke yi, suna cusa zuciya da himma sosai, zasu iya zama masu saurin fushi, amma kuma suna yafewa da wuri, Ba su jin tsoron shiga cikin yanayi mai wuya, Suna jin daɗin kasancewa cikin jagoranci ko kan gaba, Suna son Ƙalubale da gasa da ayyuka masu ƙarfi (wasanni, motsa jiki) da kuma Yin jagoranci ko aiki mai zaman kansa, Mai burujin himlu bai son Jira ko jinkiri ko kuma Kasancewa cikin wani tsari mai tsawo da za a jima ba tare da canji ba, sannan mutanene masu ƙarfin zuciya, kuma suna iya samun kwarin gwiwa mai cike da kuzari, wanda ke ƙarfafa su don cimma burinsu.Himlu yana mulkin kai, fuska, da kwakwalwa, don haka yawanci suna tsinkayar matsaloli a waɗannan sassan. Suna iya fuskantar ciwon kai da jiri Yawanci saboda damuwa ko rashin hakuri, sai rauni a fuska ko kai, Saboda yanayin su na gaggawa, sai kuma damuwa da gajiya saboda Rashin hutu na iya jawo gajiya ta kwakwalwa ko matsalolin bacci ko matsalolin zuciya na hawan jini ko matsalolin jini saboda rashin sarrafa kuzari a karshe idanu da Kumburi ko ciwon idanu",
            2: "Taurus, Shine buruji na biyu, Sauru alamace ta ƙarfi, dakewa, da jin daɗi. Kuma shine buruji na biyu mai dabi ar kasa, Mutanen saurus suna son kwanciyar hankali da rayuwa mai dadi. Suna ƙarƙashin tauraron Zahra, wanda ke ba su halaye na soyayya, ga kuma kyau, da sha’awar jin daɗi, Sauru suna da juriya mai kyau kuma suna buƙatar kiyaye tsarin rayuwarsu don gujewa matsalolin da za su iya tasowa daga rashin kula da lafiya. Sauru yana wakiltab wuya, makogwaro, da jijiyoyin wuya, don haka suna iya fuskantar matsaloli a waɗannan sassan jiki. Duk da cewa suna da ƙarfin jiki mai ƙarfi, sha awar su ga jin daɗi na iya sa su yi sakaci da motsa jiki ko cin kayan abinci masu lafiya, sukan iya kamuwa da cututtuka da suka shafi, Ciwon makogwaro mai tsanani (sore throat) ko kumburi, ko matsalolin da ke tasowa daga sanyi mai tsanani, Ciwo a wuya saboda matsalolin tsoka ko rashin motsa jiki, Matsalolin tsayayyar wuya (stiff neck) saboda zaunawa ko aiki mara motsi, sannan Saboda sha awar su ga abinci mai dadi da jin daɗi, suna da tsinkayar ƙara nauyi ko fuskantar hawan jini, haka zalika Yanayin su na jinkiri na iya haifar da kasala idan ba su motsa jiki yadda ya kamata ba.",
            3: "Jauza'a, Shine buruji na uku, Jauzaa burujice ta iska da kwarewa a sadarwa, kirkire-kirkire, da gwanintar tunani. Wannan alamar tana ƙarƙashin tasirin tauraron Udarid, wanda ke wakiltar hankali, magana, da saurin fahimta. Mutanen masu burujin jauzaa suna da saurin motsawa daga abu zuwa wani abun kuma suna jin daɗin tattaunawa, sanin sabbin abubuwa, da shiga cikin taron jama’a. A jikin dan adam yana wakiltar hannaye, kafadu, da tsarin numfashi. Saboda haka, masu burujin sukan fuskanci matsalolin lafiya masu alaƙa da waɗannan sassan. Suna da kuzari sosai, amma rashin nutsuwa da wanzuwa a cikin gaggawa na iya shafar lafiyarsu kamar, Sanyi mai tsanani, ciwon makogwaro, ko asma saboda ƙarancin kariya ko kasancewa a wuraren da ke da gurɓataccen iska, Matsalolin numfashi na dindindin idan ba a kula ba, Jauzaa yana da tasiri a kan hannaye da kafadu, don haka suna iya fuskantar ciwon tsoka ko matsalolin jijiyoyi saboda aiki mai yawa ko rashin kulawa, Saboda saurin tunani da rashin hutu, suna iya fuskantar gajiya ta kwakwalwa, wanda ke iya haifar da matsaloli kamar damuwa ko rashin bacci (insomnia), Rashin samun nutsuwa a cikin rayuwa yana sa su kasance cikin damuwa ko tsoro, wanda zai iya shafar tsarin su na lafiya gaba ɗaya, Suna da tsinkayar ciwon jiki, musamman a sassan hannu da kafada, saboda yawan motsawa ko aiki maras tsari, Masu burujin jauzaa suna da ƙwarewa a sadarwa da jin daɗin rayuwa, amma suna buƙatar su koyi kiyaye jiki da tunani. Suna da kyau wajen canzawa da sabawa da yanayi, amma yana da muhimmanci su guje wa gajiya da tabbatar da cewa suna samun hutu da isasshen kulawa da lafiya. Wannan zai ba su damar ci gaba da rayuwa cikin kuzari da jin daɗi.",
            4: "Surdanu, Shine buruji na hudu. Surdanu buruji ce ta ruwa da alaka da jin Qai, soyayya, da kariya. Wannan alamar tana ƙarƙashin tasirin wata (Moon-Qamar), wanda ke kawo canjin motsin rai da tsananin sha awa ga dangi da gida. Surdanu suna da halin tausayi, kuma suna son zama kusa da waɗanda suke ƙauna. Duk da haka, suna da saurin damuwa idan an shiga hankalinsu. Burujin Surdanu yana wakiltar ƙirji, nonuwa, da tsarin narkar da abinci (stomach). Saboda haka, suna iya fuskantar matsalolin lafiya masu alaƙa da waɗannan sassan, musamman idan suna cikin yanayin damuwa, Saboda yanayin motsin rai, suna da sauƙin samun kumburi, acidity, ko ciwon ciki, Matsalolin narkar da abinci na iya tasowa daga yawan damuwa da rashin isasshen cin abinci mai kyau, Za su iya samun ciwon ƙirji ko kumburi, musamman idan suna rayuwa a wuraren da ke da yanayi mai sanyi, A wasu lokuta, rashin lafiya na nonuwa yana iya shafar su, Surdanu suna da tsinkayar damuwa (anxiety) saboda tsananin tausayi da yin damuwa da dangi. Wannan na iya haifar da rashin bacci da matsalolin lafiya gaba ɗaya, Motsi na motsin rai yana iya rage ƙarfin garkuwar jikinsu, yana barinsu ga ciwon sanyi da mura, Canjin motsin rai mai tsanani na iya shafar lafiyarsu, wanda zai iya kawo matsaloli kamar ciwon kai ko rashin kuzari, daga karshe Surdanu suna da ƙarfi a motsin rai da ƙaunar mutane, amma suna buƙatar kiyaye lafiyar jikinsu ta hanyar rage damuwa da kula da tsarin abinci da rayuwa mai lafiya. Wannan zai taimaka musu su rayu cikin farin ciki da nutsuwa",
            5: "Usudu burujine na wuta, tana wakiltar jarumta, jagoranci, da ƙaunar zama a gaba. Usudu tana ƙarƙashin tasirin rana (Sun), wanda ke ba ta ƙarfin zuciya, kuzari, da kwarin gwiwa. Mutanen usudu suna da ƙwazo sosai, suna da sha awar burgewa, kuma suna son a yaba musu. Duk da haka, kishin kai da damuwa kan tasirin su na iya haifar da matsalolin lafiya idan ba a kula ba.Burujin Usudu ajikin dan adam yana wakiltar zuciya, kashin baya, da tsarin jini. Saboda haka, suna iya fuskantar matsalolin da suka shafi waɗannan sassan jiki, Saboda yanayinsu mai tsananin kuzari da damuwa, Leo suna da sauƙin fuskantar matsalolin hawan jini, ciwon zuciya, ko rashin kwanciyar hankali na zuciya, Rashin motsa jiki ko cin abinci mara kyau na iya ƙara haɗarin matsalolin zuciya, Matsalolin tsoka ko jijiyoyi a kashin baya, musamman idan sun yi aiki mai yawa ko suna ɗaukar nauyin da ya wuce ƙarfin su, Saboda halin su na aiki tukuru da nuna ƙwazo, suna iya samun gajiya mai tsanani idan ba su kula da hutu ba, Matsalolin da suka shafi tsarin jini, kamar rashin daidaiton yanayin zafin jiki ko kumburi a jiki, suna iya tasowa, Kishin kai da buƙatar yabawa na iya kawo damuwa ko rashin jin daɗin motsin rai idan ba a kula ba daga karshe Usudu suna alfahari da ƙarfin su da ƙarfin zuciya, amma suna buƙatar nutsuwa da kula da lafiyarsu. Sarrafa damuwa da motsa jiki zai taimaka musu su kasance masu kuzari da farin ciki cikin rayuwa",
            6: "Sumbula, Shine buruji na shida, Sumbula buruji ne na ƙasa da ke nuna hankali, tsari, da kula da kowane ƙananan cikakkun bayanai. Yana ƙarƙashin tasirin tauraron Udaridu, wanda ke ba su ƙwarewa a cikin tunani, sadarwa, da duba abubuwa a cikin zurfi. Mutanen sumbula suna son tsari, suna da ƙwarewa wajen magance matsaloli, kuma suna yawan mai da hankali ga ƙwarewar aiki. Duk da haka, suna iya fuskantar matsalolin lafiya saboda damuwa ko dogaro akan tsarin su na gudanarwa. A jikin dan adam sumbula yana wakiltar hanji, narkar da abinci, da jiki gaba ɗaya. Saboda haka, matsalolin lafiya da suka shafi narkar da abinci ko ciki suna yawan bayyana garesu, Ciwon ciki, kumburin ciki, ko matsalolin narkar da abinci, musamman idan suna cikin yanayin damuwa ko rashin tsari a cikin abinci, Matsi da matsalolin narkar da abinci na iya shafar su sosai, Saboda yawan damuwa da ƙoƙarin inganta kowane aikin, Virgo suna iya fuskantar rashin bacci da gajiya ta kwakwalwa, Saboda halin su na aiki tukuru, suna iya samun ciwon tsoka ko gajiya mai tsanani, musamman a cikin kafa ko hannu, Saboda damuwa da damuwa, suna iya fuskantar matsaloli na hanji ko ciwon ciki, wanda zai iya tasowa daga rashin abinci mai kyau ko rashin jituwa cikin rayuwa, Matsalolin zuciya ko damuwa saboda yawan tunanin su kan ayyuka da ƙarfin aiki na iya haifar da matsaloli a jiki, daga karshe sumbula na ƙoƙarin samar da tsari da kyau a kowanne fanni na rayuwarsu, amma suna buƙatar su huta da kula da lafiyar su ta hanyar rage damuwa da tabbatar da cewa suna samun hutu mai kyau da motsa jiki",
            7: "Mizanu, Shine buruji na bakwai, Mizanu burujine na iska da ke nuna daidaito, adalci, da haɗin kai. Wannan alamar tana ƙarƙashin tasirin tauraron Zahra Dabi ar iska, wanda ke ba da sha awa ga kyawawan abubuwa da ɗaukaka cikin al adu da zaman lafiya. Mizanu suna son yin daidaito a cikin rayuwa da kuma gujewa rikice-rikice ko rashin fahimta. Suna son zama tare da wasu, suna da kyau wajen warware matsaloli, kuma suna ƙoƙarin samar da zaman lafiya da haɗin kai. Saboda haka, suna buƙatar zaman lafiya da daidaito a cikin rayuwarsu, wanda zai iya shafar lafiyar su, Mizanu yana wakiltar koda, jijiya, da ƙananan jijiyoyi. Saboda haka, matsalolin lafiya da suka shafi koda ko jin tsoro na iya bayyana garesu, Mizanu suna iya fuskantar matsalolin da suka shafi koda, musamman idan suna cikin yanayi mai tsanani ko jin gajiya mai yawa, Matsalolin da suka shafi jijiyoyi na iya tasowa, musamman idan ba su kula da yanayin zafin jiki ko aiki sosai, Saboda halin su na ƙoƙari da haɗin kai, suna iya samun matsaloli a cikin narkar da abinci ko jin nauyi a ciki idan suna cikin damuwa, mizanu suna buƙatar daidaito a cikin dukkanin fannonin rayuwa, kuma idan wannan daidaito yana rasa, suna iya fuskantar matsalolin lafiyar zuciya da jiki, Suna iya jin gajiya ko damuwa idan sun rasa daidaito a cikin rayuwarsu ko kuma idan suna cikin mawuyacin yanayi na rikici ko rashin fahimta, Saboda yawan tunani da kuma buƙatar yin daidaito, Mizanu na iya jin tsoro ko damuwa idan abubuwa basu tafi yadda suke so ba, wanda na iya shafar lafiyar su, Daga karshe mizanu suna buƙatar daidaito da zaman lafiya a cikin rayuwarsu. Tare da sarrafa damuwa da kula da jiki, za su iya kiyaye lafiyarsu da kuma samun farin ciki da kwanciyar hankali",
            8: "Aqarabu, Shine buruji na takwas, Aqarabu burujine na ruwa da ke nuna zurfin tunani, ƙarfi, da sirrin zuciya. Wannan alamar tana ƙarƙashin tasirin marrikh, wanda ke ba ta ƙarfin jiki, sha awa, da ƙarfi na canji. Mutanen masu burujin aqarabu suna da matuƙar jajircewa, suna son bincika abubuwa cikin zurfi, kuma suna da halin adalci da tsananin sirri. Suna da ƙarfin zuciya, kuma sukan kasance masu jajircewa wajen cimma burinsu. Duk da haka, suna iya jin damuwa ko fuskantar matsalolin lafiya idan suna cikin yanayi mai rikitarwa ko cikin gajiya mai yawa. Burujin Aqarabu yana mulkin gabobin haihuwa da tsarin jijiyoyi, yana iya fuskantar matsalolin lafiya da suka shafi waɗannan sassan jiki, Aqarabu suna da ƙarfin jiki da kuzari, amma idan ba a kula ba, suna iya samun matsaloli na jijiyoyi, musamman idan suna cikin yanayi na damuwa ko matsalolin tunani, Saboda yadda suke cike da ƙarfi, suna iya jin gajiya ko ciwon jiki daga ɗaukar nauyi ko motsa jiki mai tsanani, A wasu lokuta, Aqarabu na iya fuskantar matsaloli a sassan haihuwa ko ƙirji, musamman idan suna cikin yanayi mai rikitarwa ko damuwa, Saboda yanayinsu na ƙarfi da aikin zuciya mai yawa, suna iya samun matsalolin zuciya ko hawan jini idan ba a kula da lafiyar zuciya da numfashi ba, Matsalolin tsokar jiki ko ɗan gajiyar motsa jiki yana iya shafar su idan ba su da tsari ko motsa jiki mai kyau, Daga karshe Aqarabu suna da ƙarfin zuciya da kuzari, amma suna buƙatar su kula da lafiyar jiki da kwakwalwa don tabbatar da cewa suna ci gaba da zama cikin kuzari da kwanciyar hankali. Sarrafa damuwa da samun lokacin hutu na taimakawa wajen inganta lafiyar su da farin ciki",
            9: "Qausu, Shine buruji na tara, Qausu burujice ta wuta da ke nuna ƙaunar yawo, bincike, da neman ilimi. Wannan alamar tana ƙarƙashin tasirin Mushtari, wanda ke kawo girma, nasara, da ƙara wa mutum sha awa ga duniya. Mutanen Qausu suna son yawo, neman sabon abu, da kuma shiga cikin abubuwan ban sha awa. Suna da kuzari mai yawa da halin kyautatawa, suna da sha awar cigaba da koyo da bincike. Duk da haka, suna iya fuskantar matsalolin lafiya idan ba su kula da lafiyar jiki da jin daɗin kwakwalwarsu a yayin da suke yawan tafiya ko kuma suna cikin gajiyar gasa da aiki mai yawa. Burujin Qausu yana wakiltar kaho, ƙafafu, da tsarin numfashi. Saboda haka, suna iya fuskantar matsalolin da suka shafi waɗannan sassan jiki, A saboda yawan motsa jiki da tsayuwar gajeren lokaci, Qausu na iya fuskantar ciwon kafa ko kumburin tsoka a ƙafafu da kaho. Hakanan, motsa jiki mai tsanani yana iya haifar da gajiya ko rauni, Suna da sha awar tafiya ko hawa tsaunuka, wanda na iya haifar da matsalolin huhu ko numfashi, musamman idan ba a kula da numfashi ko motsa jiki mai kyau ba, Rashin kula da jiki a cikin tafiya mai nisa ko gajiyar motsa jiki na iya haifar da ciwon tsoka ko gajiya mai tsanani a ƙafafu ko cikin jiki gaba ɗaya, Saboda yawan sha awar tafiya da aiki tukuru, suna iya fuskantar gajiya da rashin samun daidaito tsakanin aikin da hutu. Wannan na iya shafar lafiyarsu, musamman idan suna bin sabon abu ko tsare-tsaren da ke buƙatar mai da hankali sosai, Suna iya fuskantar matsalolin hawan jini ko damuwa idan ba su kula da hutu ko daidaito a cikin rayuwarsu. Daga karshe qausu suna da ƙarfin sha awa da kuzari, amma suna buƙatar kulawa da lafiyar jiki da kwakwalwa don tabbatar da cewa suna jin daɗi da lafiya. Samun daidaito tsakanin yawo da hutu zai taimaka musu su ci gaba da rayuwa cikin farin ciki da kuzari",
            10: "Jadyu, Shine buruji na goma, Jadyu alama ce ta ƙasa da ke nuna jajircewa, daidaito, da himma wajen cimma burin rayuwa. Wannan burujin tana ƙarƙashin tauraron Zuhal Dabi ar kasa, wanda ke ba da tsarin doka, tsari, da ɗaukar nauyi. Mutanen masu burujin jadyu suna da ƙarfin zuciya, suna son cimma nasara ta hanyar aiki tukuru, da tsare-tsaren da suka tsara. Suna da kwazo da ƙwazo, kuma suna son su kasance masu gudanarwa da jagoranci. Duk da haka, suna iya fuskantar matsalolin lafiya idan suka mai da hankali fiye da kima akan aiki ko burin nasara, wanda zai iya haifar da gajiya ko damuwa. A sassan jikin dan adam jadyu yana wakiltar ƙafa, gwiwa, da tsarin haɓakar ƙashi. Saboda haka, suna iya fuskantar matsalolin da suka shafi waɗannan sassan jiki, Saboda aikin tukuru da yawan tsayuwa ko tafiya, jadyu na iya fuskantar matsalolin gwiwa ko ƙafafu, musamman idan ba su kula da motsa jiki ko shakatawa daidai ba, Saboda yadda suka mai da hankali akan aiki da karɓar nauyi, jadyu na iya fuskantar ciwon kashi ko raunin ƙashi, musamman a cikin gwiwa ko baya, Saboda mayar da hankali ga cimma burin su, jadyu na iya jin gajiya mai tsanani ko samun matsalolin bacci, wanda na iya shafar lafiyar jikinsu da kwakwalwarsu, Yawan damuwa da ƙarfin aiki na iya haifar da matsalolin zuciya ko hawan jini, wanda na iya tasowa idan basu kula da lafiyar zuciya ba, Saboda ƙarfin tunani da yawan ƙoƙari don cimma nasara, jadyu na iya jin damuwa ko rashin jin daɗi a cikin tunani, wanda na iya shafar lafiyar kwakwalwa daga karshe suna da ƙarfi da himma, amma suna buƙatar samun daidaito tsakanin aiki da hutu. Kula da lafiyar jikinsu da kwakwalwarsu zai taimaka musu su ci gaba da samun nasara cikin farin ciki da lafiya.",
            11: "Dalwu, Shine buruji na sha daya, Lallai mai wannan burujin yana dauke da tauraron zuhal, kuma shine buruji na goma sha daya Dabi arshi iska ne, kasance mutum mai kwarin gwiwa, mai dogaro da kanshi bai cika dogaro da wani ba, kuma mutum ne mai magana daya, mutum ne mai lissafi da kirkira, yana da tatstsauran ra ayi ba kasafai abu yafiye burgeshi ba, mutanene masu izza akan ra ayinsu, basu cika san wani ya soki ra ayinsu ba hakan yana taba ji kimar su, sunada karantar mutum sosai, mutanene masu sakawa mutum ido dan gano duk wani abunda yake gudanarwa, kunada kokari wajen ganin kun wanzar da soyayya, ra ayinku abota mai karfi ne kuna san alaqa da kuma cika aiki, burinku shine duniyar nan ta zamo wuri mafi dadi ga kowa, Dalwu alamace ko ince gida ne na burace burace da tsammani, kuma gida ne na abota, shiyasa zaka samu masu wannan burujin sunada yawan buri da kuma fifita abota da rayuwar wasu, sannan masu wannan burujin sun fi kamuwa da cuta wacce ta shafi karaya ko ciwon idon sawu ko kuma wasu magudanan jinin jikinsu ya samu matsala",
            12: "Hutu, Shine buruji na sha biyu, Lallai mai wannan burujin yana dauke da tauraron Mushtari, Dabi ar shi ruwa ne, kuma shine buruji na goma sha biyu, zai kasance mutum mai karba, mai hankali da tunani da kuma soyayya abun burgewa da ban mamaki,  sufaye sunfi futowa cikin wannan burujin, mutum ne mai chanzawa Musamman ra ayi, bashi da tsayayyen raayi maana yanada fuska biyu, masu wayan nan burujin basu cika jin kwarin gwiwa ba wajen zama shugabanni ba, amma kuma kun iya daura mutum a hanyar da zai jagoranci jamaa saboda kunada baiwa kuna zama wa wasu tamkar malamai kuma madubinsu, sai dai dayawan lokuta ku da kanku, kuke mayarda kanku baya, Hutu alamace ko ince gida ne na mafarkan mutum da abubuwan mamaki, masu wannan burujin sun amince da tunaninsu da kuma yadda suke ji shiyasa suke da burin suga sun nemawa kansu wata matsayi mai girma gaske, kuma gida ne na makiya, shiyasa zaka samu masu wannan burujin sunada yawan makiya da kuma sanin logar mugunta, sannan masu wannan burujin sun fi kamuwa da cuta wacce ta shafi kafarsu musamman wajen babban yatsa, zaka ga ko takalma suka sa zaike cin babban yatsan"
        };

        // Lissafin darajar suna
        function calculateNameValue(name) {
            let total = 0;
            for (let char of name) {
                if (arabicValues[char]) {
                    total += arabicValues[char];
                }
            }
            return total;
        }

        // Babban aikin don lissafin buruji
        function calculateZodiac() {
            const userName = document.getElementById('userName').value.trim();
            const motherName = document.getElementById('motherName').value.trim();

            if (!userName || !motherName) {
                document.getElementById('result').textContent = "Da fatan za a saka sunan ka da sunan mahaifiyarka!";
                return;
            }

            const totalValue = calculateNameValue(userName) + calculateNameValue(motherName);
            let zodiacNumber = totalValue % 12;
            zodiacNumber = zodiacNumber === 0 ? 12 : zodiacNumber;

            const zodiac = zodiacSigns[zodiacNumber];
            document.getElementById('result').textContent = `Burujinka shi ne: ${zodiac}`;
        }

        // Load Arabic keyboard
        const arabicKeys = "ا ب ج د ه و ز ح ط ي ك ل م ن س ع ف ص ق ر ش ت ث خ ذ ض ظ غ ى ئ ء ؤ ة".split(" ");
        const keyboard = document.getElementById("keyboard");
        let activeInput = null;

        // Add keys to keyboard
        arabicKeys.forEach(key => {
            const button = document.createElement("div");
            button.classList.add("key");
            button.textContent = key;
            button.onclick = () => {
                if (activeInput) {
                    activeInput.value += key;
                }
            };
            keyboard.appendChild(button);
        });

        // Detect active input field
        document.getElementById("userName").onfocus = () => activeInput = document.getElementById("userName");
        document.getElementById("motherName").onfocus = () => activeInput = document.getElementById("motherName");

        
        let countdown = 20;

        setTimeout(() => {
            document.getElementById('adContainer').style.display = 'block';

            // Start countdown
            let countdownInterval = setInterval(() => {
                countdown--;
                document.getElementById('countdown').innerText = countdown;
                
                if (countdown === 0) {
                    clearInterval(countdownInterval);
                    document.getElementById('skipAd').style.display = 'block';
                    document.getElementById('adMessage').innerText = "Zaka iya rufe talla yanzu.";
                }
            }, 1000);
        }, 5000);

        function closeAd() {
            document.getElementById('adContainer').style.display = 'none';
        }
    </script>
