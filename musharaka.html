<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manhajar Lissafin Kwan Aure</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      text-align: center;
      background-color: #f9f9f9;
      direction: rtl;
      padding: 20px;
    }

    h1 {
      color: #2c3e50;
    }

    .form-container {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 0 auto;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
      text-align: center;
    }

    button {
      background-color: #007bff;
      color: #ffffff;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      margin-bottom: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
    }

    .keyboard {
      display: none;
      margin-top: 20px;
      padding: 10px;
      background-color: #f9f9f9;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      border-radius: 10px;
    }

    .keyboard button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px #0056b3;
      transition: all 0.2s ease;
      display: inline-block;
      width: 15%;
    }

    .keyboard button:hover {
      background-color: #0056b3;
      box-shadow: 0 4px #004494;
      transform: translateY(2px);
    }

    .keyboard button:active {
      background-color: #004494;
      box-shadow: 0 2px #003366;
      transform: translateY(5px);
    }

    .keyboard button:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <h1>Musharakar Aure</h1>
  <div class="form-container">
    <input type="text" id="maleName" placeholder="Sunan Miji (Larabci kawai)" onfocus="showKeyboard('maleName')">
    <input type="text" id="femaleName" placeholder="Sunan Matar (Larabci kawai)" onfocus="showKeyboard('femaleName')">
    <button onclick="calculateCompatibility()">Yi Lissafi</button>
    <div id="result" class="result"></div>
    <div id="keyboard" class="keyboard"></div>
  </div>

  <script>
    const hisabulJumal = {
      "ا": 1, "ب": 2, "ج": 3, "د": 4, "ه": 5, "و": 6, "ز": 7, "ح": 8, "ط": 9,
      "ي": 10, "ك": 20, "ل": 30, "م": 40, "ن": 50, "س": 60, "ع": 70, "ف": 80,
      "ص": 90, "ق": 100, "ر": 200, "ش": 300, "ت": 400, "ث": 500, "خ": 600,
      "ذ": 700, "ض": 800, "ظ": 900, "غ": 1000, "ى": 1, "ء": 1, "ئ": 1, "ؤ": 1, "ة": 5
    };

    let activeInput = null;

    function createKeyboard() {
      const keyboard = document.getElementById("keyboard");
      keyboard.innerHTML = ""; // Clear existing buttons
      const keys = Object.keys(hisabulJumal);
      for (let i = 0; i < keys.length; i++) {
        const button = document.createElement("button");
        button.textContent = keys[i];
        button.onclick = () => addLetterToInput(keys[i]);
        keyboard.appendChild(button);

        // Add line break after every 5 buttons
        if ((i + 1) % 5 === 0) {
          const br = document.createElement("br");
          keyboard.appendChild(br);
        }
      }
    }

    function showKeyboard(inputId) {
      activeInput = document.getElementById(inputId);
      const keyboard = document.getElementById("keyboard");
      keyboard.style.display = "block";
    }

    function addLetterToInput(letter) {
      if (activeInput) {
        activeInput.value += letter;
      }
    }

    function calculateJumal(name) {
      let total = 0;
      for (let char of name) {
        if (hisabulJumal[char]) {
          total += hisabulJumal[char];
        }
      }
      return total;
    }

    function reduceToSingleDigit(num) {
      while (num > 9) {
        num = num.toString().split("").reduce((acc, digit) => acc + parseInt(digit), 0);
      }
      return num;
    }

    function determineCompatibility(value) {
      const messages = {
        1: "Auren bashida kyau kwata kwata, idan mace kaiwa binciken nauyin gidan zai dawo kanta, sannan idan namiji akai wa zaiyi talauci ta yadda matarshi ce za take taimaka mishi",
        2: "Masha Allah, ina tayaka murna wannan auren yana da matukar kyau kuma aurene na budi da samun arziki, gaskiya na tayaka murna kwarai da gaske, Allah ya sanya Albarka aciki",
        3: "Auren bashida kyau kwata kwata, Akwai talauci da tsiya aciki, sannan auren ana samun matsalar yan uwa ta bangaren mai tambaya",
        4: "Auren tsaka tsakiya a wurin wasu ma cewa sukeyi bashi da kyau sai dai gaskiya anfi dangantashi da tsaka tsaki ba yabo ba fallasa, wanda wasu suka ce aurene da ake gina gidaje ko mallakan filaye amma ana samun matsala daga mahaifiyar namijin ko mahifin shin",
        5: "Masha Allah, ina tayaka murna wannan auren yana da matukar kyau kuma aurene na budi da samun arziki akwai soyayya aciki, sannan akwai haihuwar yara sosai acikin auren sai dai arzikin wannan aure a hankali a hankali yake zuwa amma fa ana cin kwakwa kamun auren ya daidaitu, sai dai ba kowa bane yake fuskantar hakan, gaskiya na tayaka murna kwarai da gaske, Allah ya sanya Albarka aciki",
        6: "Auren bashida kyau kwata kwata, Akwai talauci da tsiya aciki, sannan auren ana samun matsala sosai, miji baya ciyar da matarshi sosai, kuma kotu ce take raba auren",
        7: "Masha Allah, ina tayaka murna wannan auren yana da matukar kyau kuma aurene na budi da samun arziki, gaskiya na tayaka murna kwarai da gaske, Allah ya sanya Albarka aciki",
        8: "Auren yana tsaka-tsakine sai dai yanada kyau ga ma'aikatan gobnati ko ma'aikin makaranta malami kenan ko kuma dan siyasa",
        9: "Auren bai dace ba kwata-kwata."
      };
      return messages[value] || "Ba a iya tantancewa.";
    }

    function calculateCompatibility() {
      const maleName = document.getElementById("maleName").value.trim();
      const femaleName = document.getElementById("femaleName").value.trim();

      if (!maleName || !femaleName) {
        document.getElementById("result").innerText = "Don Allah shigar da sunaye!";
        return;
      }

      const maleValue = calculateJumal(maleName);
      const femaleValue = calculateJumal(femaleName);

      let combinedValue = maleValue + femaleValue + 7;
      combinedValue = reduceToSingleDigit(combinedValue);

      const compatibility = determineCompatibility(combinedValue);

      document.getElementById("result").innerText = 
        `Jimilla: ${combinedValue} \nSakamako: ${compatibility}`;
    }

    createKeyboard();
  </script>
    <script type='text/javascript' src='//yapabbreviate.com/69/6c/3f/696c3f042a9bcf8532c1c91e0e224c2e.js'></script>
</body>
</html>
