<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monnify Payment Integration</title>
  <script src="https://sdk.monnify.com/plugin/monnify.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      text-align: center;
      padding: 50px;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #333;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result {
      margin-top: 20px;
      padding: 10px;
      background: #eef;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Monnify Payment</h1>
    <p>Complete the form below to make a payment.</p>
    <form id="paymentForm">
      <input type="text" id="customerName" placeholder="Your Name" required>
      <input type="email" id="customerEmail" placeholder="Your Email" required>
      <input type="number" id="amount" placeholder="Amount (NGN)" required>
      <button type="button" onclick="makePayment()">Pay Now</button>
    </form>
    <div class="result" id="result"></div>
  </div>

  <script>
    // Monnify Payment Function
    function makePayment() {
      const customerName = document.getElementById('customerName').value;
      const customerEmail = document.getElementById('customerEmail').value;
      const amount = document.getElementById('amount').value;

      if (!customerName || !customerEmail || !amount) {
        alert("Please fill all fields.");
        return;
      }

      MonnifySDK.initialize({
        amount: parseFloat(amount),
        currency: "NGN",
        reference: "TXN_" + Date.now(), // Unique transaction reference
        customerName: customerName,
        customerEmail: customerEmail,
        apiKey: "MK_TEST_37TU0JWQS5", // Replace with your Monnify API Key
        contractCode: "4461857308", // Replace with your Monnify Contract Code
        paymentDescription: "Payment for services",
        paymentMethods: ["CARD", "ACCOUNT_TRANSFER"], // Available payment methods
        onComplete: function (response) {
          // Handle payment completion
          const resultDiv = document.getElementById("result");
          if (response.paymentStatus === "PAID") {
            resultDiv.innerHTML = `<p><strong>Payment Successful!</strong><br>Transaction Reference: ${response.transactionReference}</p>`;
          } else {
            resultDiv.innerHTML = `<p><strong>Payment Failed!</strong><br>Reason: ${response.responseMessage}</p>`;
          }
        },
        onClose: function () {
          alert("Payment process was closed.");
        }
      });
    }
  </script>
</body>
</html>
